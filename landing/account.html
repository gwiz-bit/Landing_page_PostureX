<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hồ sơ — PostureX</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="favicon-256.png" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0B0C0D; --surface: #1A1B1D; --surface-elevated: #222325; --border: #2C2D30;
    --primary: #FF6F4F; --primary-muted: #402920; --on-primary: #FFFFFF;
    --text-primary: #F5F5F5; --text-secondary: #9A9A9E; --text-tertiary: #5C5D60;
    --danger: #FF6B6B; --danger-muted: #3A1F1F; --success: #4ADE80; --success-muted: #16331F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text-primary);
    font-family: "Be Vietnam Pro", system-ui, sans-serif;
  }
  a { color: inherit; text-decoration: none; }
  header.top-bar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 24px;
    background: rgba(11, 12, 13, 0.82);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  header.top-bar .brand {
    display: flex; align-items: center; gap: 10px;
    font-family: "Inter", sans-serif; font-weight: 800; font-size: 1.05rem;
  }
  header.top-bar .home-link { font-size: 0.86rem; color: var(--text-secondary); }
  header.top-bar .home-link:hover { color: var(--text-primary); }
  main.wrap { max-width: 560px; margin: 0 auto; padding: 40px 24px 80px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
    padding: 32px; margin-bottom: 20px;
  }
  h1 { font-family: "Inter", sans-serif; font-size: 1.4rem; margin: 0 0 4px; }
  h2 { font-family: "Inter", sans-serif; font-size: 1.05rem; margin: 0 0 16px; }
  .subtitle { color: var(--text-secondary); font-size: 0.9rem; margin: 0 0 24px; }

  /* Hàng xem — nhãn + giá trị + icon sửa */
  .info-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 0; border-bottom: 1px solid var(--border);
  }
  .info-row:last-of-type { border-bottom: none; }
  .info-text { display: flex; flex-direction: column; gap: 2px; }
  .info-label { font-size: 0.78rem; color: var(--text-secondary); }
  .info-value { font-size: 0.95rem; font-weight: 600; color: var(--text-primary); }
  .info-value.muted { color: var(--text-tertiary); font-weight: 400; }
  .icon-btn {
    background: var(--surface-elevated); border: 1px solid var(--border); color: var(--text-secondary);
    width: 34px; height: 34px; border-radius: 10px; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-family: inherit;
  }
  .icon-btn:hover { border-color: var(--primary); color: var(--primary); }

  /* Khung sửa inline — ẩn mặc định */
  .edit-row { display: none; padding: 10px 0 16px; border-bottom: 1px solid var(--border); }
  .edit-row:last-of-type { border-bottom: none; }
  .edit-row.active { display: block; }
  .edit-row label { display: block; font-size: 0.78rem; color: var(--text-secondary); margin-bottom: 6px; }
  input, select {
    width: 100%; background: var(--surface-elevated); border: 1px solid var(--border);
    border-radius: 10px; padding: 11px 14px; color: var(--text-primary);
    font-size: 0.95rem; font-family: inherit;
  }
  input:focus, select:focus { outline: none; border-color: var(--primary); }
  .chip-group { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    background: var(--surface-elevated); border: 1px solid var(--border); color: var(--text-secondary);
    border-radius: 999px; padding: 8px 16px; font-size: 0.86rem; font-family: inherit;
    cursor: pointer; transition: all 0.12s ease;
  }
  .chip.selected { background: var(--primary-muted); border-color: var(--primary); color: var(--text-primary); }
  .edit-actions { display: flex; gap: 10px; margin-top: 12px; }
  .edit-actions button {
    flex: 1; border-radius: 999px; padding: 10px; font-family: inherit; font-size: 0.88rem;
    font-weight: 700; cursor: pointer; border: none;
  }
  .btn-save { background: var(--primary); color: var(--on-primary); }
  .btn-save:disabled { opacity: 0.5; cursor: default; }
  .btn-cancel { background: transparent; border: 1px solid var(--border) !important; color: var(--text-secondary); }

  button.submit, a.submit {
    width: 100%; margin-top: 4px; background: var(--primary); color: var(--on-primary);
    border: none; border-radius: 999px; padding: 13px; font-size: 0.95rem; font-weight: 700;
    font-family: inherit; cursor: pointer; box-sizing: border-box; display: block; text-align: center;
  }
  button.submit:disabled { opacity: 0.5; cursor: default; }
  button.logout {
    width: 100%; margin-top: 8px; background: transparent; color: var(--text-secondary);
    border: 1px solid var(--border); border-radius: 999px; padding: 12px;
    font-family: inherit; font-size: 0.92rem; cursor: pointer;
  }
  button.logout:hover { border-color: var(--primary); color: var(--text-primary); }
  .error {
    display: none; background: var(--danger-muted); color: var(--danger);
    border-radius: 10px; padding: 10px 14px; font-size: 0.86rem; margin-top: 12px;
  }
  .success {
    display: none; background: var(--success-muted); color: var(--success);
    border-radius: 10px; padding: 10px 14px; font-size: 0.86rem; margin-top: 12px;
  }
  #loading, #guest { text-align: center; color: var(--text-secondary); }
  #guest a { color: var(--primary); font-weight: 600; }
  .hint-small { color: var(--text-tertiary); font-size: 0.78rem; margin-top: 10px; line-height: 1.5; }
  .add-field-link {
    display: inline-block; margin-top: 8px; color: var(--primary); font-size: 0.86rem;
    font-weight: 600; cursor: pointer; background: none; border: none; font-family: inherit; padding: 0;
  }
</style>
</head>
<body>

<header class="top-bar">
  <a href="index.html" class="brand">
    <img src="assets/images/logo-icon.png" width="24" height="24" alt="" style="border-radius:6px;" />
    PostureX
  </a>
  <a href="index.html" class="home-link">← Trang chủ</a>
</header>

<main class="wrap">
  <div id="loading">Đang tải hồ sơ...</div>

  <div id="guest" style="display:none;">
    Bạn chưa đăng nhập. <a href="login.html">Đăng nhập ngay</a>
  </div>

  <div id="content" style="display:none;">
    <h1>Hồ sơ của bạn</h1>
    <p class="subtitle">Xem và cập nhật thông tin cá nhân.</p>

    <!-- Thông tin tài khoản: họ tên / email / sđt -->
    <div class="card">
      <h2>Thông tin tài khoản</h2>

      <div class="info-row" id="view-full-name">
        <div class="info-text">
          <span class="info-label">Họ và tên</span>
          <span class="info-value" id="value-full-name">—</span>
        </div>
        <button class="icon-btn" id="edit-full-name-btn" title="Sửa">✏️</button>
      </div>
      <div class="edit-row" id="edit-full-name">
        <label for="input-full-name">Họ và tên</label>
        <input type="text" id="input-full-name" />
        <div class="error" id="error-full-name"></div>
        <div class="edit-actions">
          <button class="btn-cancel" id="cancel-full-name">Huỷ</button>
          <button class="btn-save" id="save-full-name">Lưu</button>
        </div>
      </div>

      <div class="info-row">
        <div class="info-text">
          <span class="info-label">Email</span>
          <span class="info-value" id="value-email">—</span>
        </div>
      </div>

      <div class="info-row">
        <div class="info-text">
          <span class="info-label">Số điện thoại</span>
          <span class="info-value muted">(chưa cập nhật)</span>
        </div>
      </div>
    </div>

    <!-- Mật khẩu — giống app: chỉ cần nhập mật khẩu mới 2 lần, không cần
         mật khẩu cũ hay email xác thực, vì đã đăng nhập hợp lệ rồi. -->
    <div class="card">
      <h2>Mật khẩu</h2>
      <label for="new-password">Mật khẩu mới</label>
      <input type="password" id="new-password" minlength="6" placeholder="Để trống nếu không đổi" />
      <label for="confirm-password" style="margin-top:12px;">Nhập lại mật khẩu mới</label>
      <input type="password" id="confirm-password" minlength="6" />
      <div class="error" id="error-password"></div>
      <div class="success" id="success-password"></div>
      <button class="submit" id="save-password-btn">Đổi mật khẩu</button>
    </div>

    <!-- Thông tin cơ thể — chỉ hiện mục đã điền, mỗi mục sửa riêng -->
    <div class="card">
      <h2>Thông tin cơ thể</h2>
      <div id="body-info-rows"></div>
      <button class="add-field-link" id="add-field-btn" style="display:none;">+ Thêm thông tin còn thiếu</button>

      <div class="edit-row" id="edit-missing-fields">
        <div id="missing-fields-inputs"></div>
        <div class="error" id="error-missing"></div>
        <div class="edit-actions">
          <button class="btn-cancel" id="cancel-missing">Huỷ</button>
          <button class="btn-save" id="save-missing">Lưu</button>
        </div>
      </div>
    </div>

    <!-- Lịch tập -->
    <div class="card">
      <h2>Lịch tập</h2>
      <p class="subtitle" style="margin-bottom:16px;">Xem lịch tập 4 tuần đã sinh cho bạn.</p>
      <a href="home.html" class="submit">Xem lịch tập</a>
    </div>

    <button class="logout" id="logout-btn">Đăng xuất</button>
  </div>
</main>

<script>
  // Định nghĩa 6 trường thông tin cơ thể — nguồn duy nhất cho cả phần xem
  // lẫn phần sửa, tránh lặp code cho từng trường.
  const BODY_FIELDS = [
    { key: "gender", label: "Giới tính", type: "chip", options: ["Male", "Female", "Other"] },
    { key: "age", label: "Tuổi", type: "number", min: 1, max: 120 },
    { key: "height_cm", label: "Chiều cao (cm)", type: "number", min: 140, max: 220 },
    { key: "weight_kg", label: "Cân nặng (kg)", type: "number", min: 35, max: 180 },
    { key: "fitness_level", label: "Trình độ tập luyện", type: "chip", options: ["Beginner", "Intermediate", "Advanced"] },
    { key: "weekly_goal", label: "Buổi tập/tuần", type: "number", min: 1, max: 7 },
  ];

  let currentFullName = "";
  let currentEmail = "";
  let currentProfile = {};

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // --- Render phần "Thông tin cơ thể": chỉ hiện trường đã có giá trị ---
  function renderBodyInfo(profile) {
    currentProfile = profile;
    const container = document.getElementById("body-info-rows");
    container.innerHTML = "";
    const missing = [];

    for (const field of BODY_FIELDS) {
      const value = profile[field.key];
      if (value == null) {
        missing.push(field);
        continue;
      }
      const viewId = `view-${field.key}`;
      const editId = `edit-${field.key}`;
      const displayValue = field.key === "height_cm" ? `${value} cm` : field.key === "weight_kg" ? `${value} kg` : value;

      const row = document.createElement("div");
      row.innerHTML = `
        <div class="info-row" id="${viewId}">
          <div class="info-text">
            <span class="info-label">${field.label}</span>
            <span class="info-value">${escapeHtml(displayValue)}</span>
          </div>
          <button class="icon-btn" data-edit-field="${field.key}" title="Sửa">✏️</button>
        </div>
        <div class="edit-row" id="${editId}">
          <label>${field.label}</label>
          <div id="${editId}-input"></div>
          <div class="error" id="error-${field.key}"></div>
          <div class="edit-actions">
            <button class="btn-cancel" data-cancel-field="${field.key}">Huỷ</button>
            <button class="btn-save" data-save-field="${field.key}">Lưu</button>
          </div>
        </div>
      `;
      container.appendChild(row);

      renderFieldInput(`${editId}-input`, field, value);

      row.querySelector(`[data-edit-field="${field.key}"]`).addEventListener("click", () => toggleFieldEdit(field.key, true));
      row.querySelector(`[data-cancel-field="${field.key}"]`).addEventListener("click", () => toggleFieldEdit(field.key, false));
      row.querySelector(`[data-save-field="${field.key}"]`).addEventListener("click", () => saveField(field));
    }

    const addBtn = document.getElementById("add-field-btn");
    if (missing.length > 0) {
      addBtn.style.display = "inline-block";
      addBtn.onclick = () => renderMissingFieldsForm(missing);
    } else {
      addBtn.style.display = "none";
    }
  }

  function renderFieldInput(containerId, field, currentValue) {
    const el = document.getElementById(containerId);
    if (field.type === "chip") {
      el.innerHTML = `<div class="chip-group" data-chip-group="${field.key}"></div>`;
      const group = el.querySelector(".chip-group");
      field.options.forEach((opt) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chip" + (opt === currentValue ? " selected" : "");
        btn.textContent = opt;
        btn.dataset.value = opt;
        btn.addEventListener("click", () => {
          [...group.children].forEach((c) => c.classList.remove("selected"));
          btn.classList.add("selected");
        });
        group.appendChild(btn);
      });
    } else {
      el.innerHTML = `<input type="number" min="${field.min}" max="${field.max}" value="${currentValue ?? ""}" data-field-input="${field.key}" />`;
    }
  }

  function toggleFieldEdit(key, show) {
    document.getElementById(`view-${key}`).style.display = show ? "none" : "flex";
    document.getElementById(`edit-${key}`).classList.toggle("active", show);
  }

  function readFieldValue(field) {
    if (field.type === "chip") {
      const selected = document.querySelector(`[data-chip-group="${field.key}"] .chip.selected`);
      return selected ? selected.dataset.value : null;
    }
    const input = document.querySelector(`[data-field-input="${field.key}"]`);
    return input.value ? Number(input.value) : null;
  }

  async function saveField(field) {
    const errorBox = document.getElementById(`error-${field.key}`);
    errorBox.style.display = "none";
    const value = readFieldValue(field);
    if (value == null) {
      errorBox.textContent = "Vui lòng nhập giá trị.";
      errorBox.style.display = "block";
      return;
    }
    try {
      const res = await fetch("/api/profile", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ [field.key]: value }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Không lưu được.");
      renderBodyInfo(data);
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = "block";
    }
  }

  // --- "+ Thêm thông tin còn thiếu" — gom các trường chưa có vào 1 form ---
  function renderMissingFieldsForm(missingFields) {
    const panel = document.getElementById("edit-missing-fields");
    const container = document.getElementById("missing-fields-inputs");
    container.innerHTML = "";
    missingFields.forEach((field) => {
      const wrap = document.createElement("div");
      wrap.style.marginBottom = "14px";
      wrap.innerHTML = `<label>${field.label}</label><div id="missing-input-${field.key}"></div>`;
      container.appendChild(wrap);
      renderFieldInput(`missing-input-${field.key}`, field, null);
    });
    panel.classList.add("active");
    panel.dataset.fields = JSON.stringify(missingFields.map((f) => f.key));
  }

  document.getElementById("cancel-missing").addEventListener("click", () => {
    document.getElementById("edit-missing-fields").classList.remove("active");
  });

  document.getElementById("save-missing").addEventListener("click", async () => {
    const panel = document.getElementById("edit-missing-fields");
    const keys = JSON.parse(panel.dataset.fields || "[]");
    const payload = {};
    for (const key of keys) {
      const field = BODY_FIELDS.find((f) => f.key === key);
      const value = readFieldValue(field);
      if (value != null) payload[key] = value;
    }
    const errorBox = document.getElementById("error-missing");
    errorBox.style.display = "none";
    try {
      const res = await fetch("/api/profile", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Không lưu được.");
      panel.classList.remove("active");
      renderBodyInfo(data);
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = "block";
    }
  });

  // --- Họ và tên ---
  document.getElementById("edit-full-name-btn").addEventListener("click", () => {
    document.getElementById("input-full-name").value = currentFullName;
    document.getElementById("view-full-name").style.display = "none";
    document.getElementById("edit-full-name").classList.add("active");
  });
  document.getElementById("cancel-full-name").addEventListener("click", () => {
    document.getElementById("view-full-name").style.display = "flex";
    document.getElementById("edit-full-name").classList.remove("active");
  });
  document.getElementById("save-full-name").addEventListener("click", async () => {
    const errorBox = document.getElementById("error-full-name");
    errorBox.style.display = "none";
    const newName = document.getElementById("input-full-name").value.trim();
    if (!newName) {
      errorBox.textContent = "Họ tên không được để trống.";
      errorBox.style.display = "block";
      return;
    }
    try {
      const res = await fetch("/api/account", {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ full_name: newName }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Không lưu được.");
      currentFullName = data.full_name || newName;
      document.getElementById("value-full-name").textContent = currentFullName;
      document.getElementById("view-full-name").style.display = "flex";
      document.getElementById("edit-full-name").classList.remove("active");
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = "block";
    }
  });

  // --- Đổi mật khẩu — giống app: chỉ cần nhập mật khẩu mới 2 lần, gọi
  // thẳng PATCH /api/account (đang đăng nhập hợp lệ coi như đủ xác thực). ---
  document.getElementById("save-password-btn").addEventListener("click", async () => {
    const errorBox = document.getElementById("error-password");
    const successBox = document.getElementById("success-password");
    errorBox.style.display = "none";
    successBox.style.display = "none";

    const newPassword = document.getElementById("new-password").value;
    const confirmPassword = document.getElementById("confirm-password").value;

    if (!newPassword) {
      errorBox.textContent = "Vui lòng nhập mật khẩu mới.";
      errorBox.style.display = "block";
      return;
    }
    if (newPassword !== confirmPassword) {
      errorBox.textContent = "Mật khẩu nhập lại không khớp.";
      errorBox.style.display = "block";
      return;
    }

    const btn = document.getElementById("save-password-btn");
    btn.disabled = true;
    try {
      const res = await fetch("/api/account", {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ password: newPassword }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Không đổi được mật khẩu.");

      successBox.textContent = "Đã đổi mật khẩu thành công.";
      successBox.style.display = "block";
      document.getElementById("new-password").value = "";
      document.getElementById("confirm-password").value = "";
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = "block";
    } finally {
      btn.disabled = false;
    }
  });

  // --- Tải dữ liệu ban đầu ---
  (async () => {
    const loading = document.getElementById("loading");
    const guest = document.getElementById("guest");
    const content = document.getElementById("content");

    try {
      const meRes = await fetch("/api/auth/me", { credentials: "include" });
      if (!meRes.ok) throw new Error("not logged in");
      const me = await meRes.json();

      currentFullName = me.full_name || "";
      currentEmail = me.email;
      document.getElementById("value-full-name").textContent = currentFullName || "(chưa cập nhật)";
      document.getElementById("value-email").textContent = me.email;

      const profileRes = await fetch("/api/profile", { credentials: "include" });
      const profile = profileRes.ok ? await profileRes.json() : {};
      renderBodyInfo(profile);

      loading.style.display = "none";
      content.style.display = "block";
    } catch {
      loading.style.display = "none";
      guest.style.display = "block";
    }
  })();

  document.getElementById("logout-btn")?.addEventListener("click", async () => {
    // Cố tình KHÔNG xoá "posturex_plan" — xem ghi chú tương tự trong home.html.
    await fetch("/api/auth/logout", { method: "POST", credentials: "include" });
    window.location.href = "login.html";
  });
</script>

</body>
</html>
