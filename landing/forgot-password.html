<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quên mật khẩu — PostureX</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="favicon-256.png" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0B0C0D;
    --surface: #1A1B1D;
    --surface-elevated: #222325;
    --border: #2C2D30;
    --primary: #FF6F4F;
    --primary-muted: #402920;
    --on-primary: #FFFFFF;
    --text-primary: #F5F5F5;
    --text-secondary: #9A9A9E;
    --text-tertiary: #5C5D60;
    --danger: #FF6B6B;
    --danger-muted: #3A1F1F;
    --success: #4ADE80;
    --success-muted: #1C3324;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text-primary);
    font-family: "Be Vietnam Pro", system-ui, -apple-system, sans-serif;
  }
  a { color: inherit; text-decoration: none; }
  header.top-bar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 24px;
    background: rgba(11, 12, 13, 0.82);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  header.top-bar .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: "Inter", sans-serif;
    font-weight: 800;
    font-size: 1.05rem;
  }
  header.top-bar .home-link { font-size: 0.86rem; color: var(--text-secondary); }
  header.top-bar .home-link:hover { color: var(--text-primary); }
  .lang-toggle {
    display: flex; align-items: center; gap: 2px; background: var(--surface-elevated);
    border: 1px solid var(--border); border-radius: 999px; padding: 3px; margin-left: 14px;
  }
  .lang-toggle button {
    background: none; border: none; color: var(--text-secondary); font-family: inherit;
    font-size: 0.76rem; font-weight: 700; padding: 5px 10px; border-radius: 999px; cursor: pointer;
  }
  .lang-toggle button.active { background: var(--primary); color: var(--on-primary); }
  main.center-wrap {
    min-height: calc(100vh - 73px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .card {
    width: 100%;
    max-width: 400px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px 32px;
  }
  @media (max-width: 420px) { .card { padding: 32px 20px; } }
  h1 {
    font-family: "Inter", sans-serif;
    font-size: 1.5rem;
    font-weight: 800;
    text-align: center;
    margin: 0 0 6px;
  }
  .subtitle {
    text-align: center;
    color: var(--text-secondary);
    font-size: 0.92rem;
    line-height: 1.5;
    margin: 0 0 24px;
  }
  label {
    display: block;
    font-size: 0.82rem;
    color: var(--text-secondary);
    margin-bottom: 6px;
    margin-top: 16px;
  }
  input {
    width: 100%;
    background: var(--surface-elevated);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text-primary);
    font-size: 0.95rem;
    font-family: inherit;
  }
  input:focus { outline: none; border-color: var(--primary); }
  .field-hint { font-size: 0.76rem; color: var(--text-tertiary); margin: 6px 0 0; line-height: 1.5; }
  button.submit {
    width: 100%;
    margin-top: 26px;
    background: var(--primary);
    color: var(--on-primary);
    border: none;
    border-radius: 999px;
    padding: 13px;
    font-size: 0.95rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  button.submit:hover { opacity: 0.92; }
  button.submit:disabled { opacity: 0.55; cursor: default; }
  .link-btn {
    display: block;
    margin: 16px auto 0;
    background: none;
    border: none;
    color: var(--primary);
    font-family: inherit;
    font-size: 0.86rem;
    font-weight: 600;
    cursor: pointer;
  }
  .link-btn:disabled { opacity: 0.55; cursor: default; }
  .msg {
    display: none;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 0.86rem;
    line-height: 1.5;
    margin-top: 18px;
  }
  .msg.error { background: var(--danger-muted); color: var(--danger); }
  .msg.ok { background: var(--success-muted); color: var(--success); }
  .hint {
    text-align: center;
    color: var(--text-tertiary);
    font-size: 0.82rem;
    margin-top: 22px;
    line-height: 1.6;
  }
  .step { display: none; }
  .step.active { display: block; }
</style>
</head>
<body>

<header class="top-bar">
  <a href="index.html" class="brand">
    <img src="assets/images/logo-icon.png" width="24" height="24" alt="" style="border-radius:6px;" />
    PostureX
  </a>
  <div style="display:flex; align-items:center;">
    <a href="index.html" class="home-link" data-i18n="nav.backHome">← Trang chủ</a>
    <div class="lang-toggle">
      <button type="button" data-lang-toggle="vi" onclick="setLang('vi')">VI</button>
      <button type="button" data-lang-toggle="en" onclick="setLang('en')">EN</button>
    </div>
  </div>
</header>

<main class="center-wrap">
<div class="card">
  <!-- Bước 1: nhập email → app gửi mã đặt lại mật khẩu -->
  <section class="step active" id="step-1">
    <h1 data-i18n="forgot.title">Quên mật khẩu</h1>
    <p class="subtitle" data-i18n="forgot.subtitle">Nhập email tài khoản của bạn, chúng tôi sẽ gửi mã đặt lại mật khẩu.</p>
    <form id="form-1">
      <label for="email" data-i18n="forgot.emailLabel">Email</label>
      <input type="email" id="email" autocomplete="email" required />
      <div class="msg error" id="error-1"></div>
      <button type="submit" class="submit" id="submit-1" data-i18n="forgot.send">Gửi mã</button>
    </form>
  </section>

  <!-- Bước 2: dán mã + mật khẩu mới (giống ResetPasswordScreen bên app) -->
  <section class="step" id="step-2">
    <h1 data-i18n="forgot.step2.title">Đặt mật khẩu mới</h1>
    <p class="subtitle" id="step2-subtitle"></p>
    <form id="form-2">
      <label for="code" data-i18n="forgot.codeLabel">Mã đặt lại mật khẩu</label>
      <input type="text" id="code" autocomplete="one-time-code" spellcheck="false" required />
      <label for="new-password" data-i18n="forgot.newPasswordLabel">Mật khẩu mới</label>
      <input type="password" id="new-password" autocomplete="new-password" minlength="8" required />
      <p class="field-hint" data-i18n="register.passwordHint">Ít nhất 8 ký tự, gồm chữ hoa, chữ thường, số và ký tự đặc biệt.</p>
      <label for="confirm-password" data-i18n="forgot.confirmPasswordLabel">Nhập lại mật khẩu mới</label>
      <input type="password" id="confirm-password" autocomplete="new-password" minlength="8" required />
      <div class="msg" id="msg-2"></div>
      <button type="submit" class="submit" id="submit-2" data-i18n="forgot.submit">Đặt lại mật khẩu</button>
    </form>
    <button type="button" class="link-btn" id="resend" data-i18n="forgot.resend">Gửi lại mã</button>
  </section>

  <p class="hint"><a href="login.html" style="color:var(--primary); font-weight:600;" data-i18n="forgot.backToLogin">← Quay lại đăng nhập</a></p>
</div>
</main>

<script src="assets/js/i18n.js"></script>
<script>
  let email = "";

  function showMsg(id, text, kind) {
    const box = document.getElementById(id);
    box.textContent = text;
    box.className = "msg " + kind;
    box.style.display = "block";
  }
  function hideMsg(id) {
    document.getElementById(id).style.display = "none";
  }
  function setBusy(btn, busy, labelKey) {
    btn.disabled = busy;
    btn.textContent = busy ? t("common.processing") : t(labelKey);
  }
  // Cùng quy tắc với backend app (app/schemas/validators.py) — giống register.html.
  function isStrongPassword(pw) {
    return pw.length >= 8 && /[A-Z]/.test(pw) && /[a-z]/.test(pw) && /\d/.test(pw) && /[^A-Za-z0-9]/.test(pw);
  }

  function renderStep2Subtitle() {
    document.getElementById("step2-subtitle").textContent = t("forgot.step2.subtitle", { email });
  }
  document.addEventListener("posturex:langchange", () => {
    if (email) renderStep2Subtitle();
  });

  async function requestCode() {
    const res = await fetch("/api/auth/forgot-password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || t("forgot.failed"));
  }

  // --- Bước 1 ---
  document.getElementById("form-1").addEventListener("submit", async (e) => {
    e.preventDefault();
    hideMsg("error-1");
    const btn = document.getElementById("submit-1");
    email = document.getElementById("email").value.trim();
    setBusy(btn, true, "forgot.send");
    try {
      await requestCode();
      renderStep2Subtitle();
      document.getElementById("step-1").classList.remove("active");
      document.getElementById("step-2").classList.add("active");
      document.getElementById("code").focus();
    } catch (err) {
      showMsg("error-1", err.message, "error");
    } finally {
      setBusy(btn, false, "forgot.send");
    }
  });

  // --- Gửi lại mã ---
  document.getElementById("resend").addEventListener("click", async () => {
    hideMsg("msg-2");
    const btn = document.getElementById("resend");
    btn.disabled = true;
    try {
      await requestCode();
      showMsg("msg-2", t("forgot.resent"), "ok");
    } catch (err) {
      showMsg("msg-2", err.message, "error");
    } finally {
      btn.disabled = false;
    }
  });

  // --- Bước 2 ---
  document.getElementById("form-2").addEventListener("submit", async (e) => {
    e.preventDefault();
    hideMsg("msg-2");
    const token = document.getElementById("code").value.trim();
    const newPassword = document.getElementById("new-password").value;
    const confirmPassword = document.getElementById("confirm-password").value;

    if (newPassword !== confirmPassword) return showMsg("msg-2", t("register.passwordMismatch"), "error");
    if (!isStrongPassword(newPassword)) return showMsg("msg-2", t("register.passwordWeak"), "error");

    const btn = document.getElementById("submit-2");
    setBusy(btn, true, "forgot.submit");
    try {
      const res = await fetch("/api/auth/reset-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, new_password: newPassword, confirm_password: confirmPassword }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || t("forgot.resetFailed"));

      showMsg("msg-2", t("forgot.success"), "ok");
      document.getElementById("resend").disabled = true;
      setTimeout(() => { window.location.href = "login.html"; }, 2000);
    } catch (err) {
      showMsg("msg-2", err.message, "error");
      setBusy(btn, false, "forgot.submit");
    }
  });
</script>

</body>
</html>
