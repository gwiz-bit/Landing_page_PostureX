<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Thanh toán — PostureX</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="favicon-256.png" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0B0C0D; --surface: #1A1B1D; --surface-elevated: #222325; --border: #2C2D30;
    --primary: #FF6F4F; --primary-muted: #402920; --on-primary: #FFFFFF;
    --text-primary: #F5F5F5; --text-secondary: #9A9A9E; --text-tertiary: #5C5D60;
    --danger: #FF6B6B; --danger-muted: #3A1F1F; --success: #4ADE80;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text-primary);
    font-family: "Be Vietnam Pro", system-ui, -apple-system, sans-serif;
  }
  a { color: inherit; text-decoration: none; }
  header.top-bar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 24px;
    background: rgba(11, 12, 13, 0.82);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  header.top-bar .brand {
    display: flex; align-items: center; gap: 10px;
    font-family: "Inter", sans-serif; font-weight: 800; font-size: 1.05rem;
  }
  header.top-bar .home-link { font-size: 0.86rem; color: var(--text-secondary); }
  header.top-bar .home-link:hover { color: var(--text-primary); }
  .lang-toggle {
    display: flex; align-items: center; gap: 2px; background: var(--surface-elevated);
    border: 1px solid var(--border); border-radius: 999px; padding: 3px; margin-left: 14px;
  }
  .lang-toggle button {
    background: none; border: none; color: var(--text-secondary); font-family: inherit;
    font-size: 0.76rem; font-weight: 700; padding: 5px 10px; border-radius: 999px; cursor: pointer;
  }
  .lang-toggle button.active { background: var(--primary); color: var(--on-primary); }
  main.wrap { max-width: 520px; margin: 0 auto; padding: 48px 24px 80px; }
  h1 { font-family: "Inter", sans-serif; font-size: 1.6rem; font-weight: 800; margin: 0 0 24px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 8px 24px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--border); }
  .row:last-child { border-bottom: none; }
  .row .k { color: var(--text-tertiary); font-size: 0.82rem; }
  .row .v { font-weight: 600; font-size: 0.95rem; text-align: right; }
  .row .v.big { font-family: "Inter", sans-serif; font-size: 1.3rem; font-weight: 800; color: var(--primary); }
  .btn {
    display: block; width: 100%; text-align: center; margin-top: 24px;
    background: var(--primary); color: var(--on-primary); border: none; border-radius: 999px;
    padding: 15px; font-family: inherit; font-size: 1rem; font-weight: 700; cursor: pointer;
    transition: opacity 0.15s ease;
  }
  .btn:hover { opacity: 0.92; }
  .btn:disabled { opacity: 0.55; cursor: default; }
  .btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); margin-top: 12px; }
  .btn.ghost:hover { border-color: var(--text-secondary); color: var(--text-primary); }
  .note { color: var(--text-tertiary); font-size: 0.82rem; line-height: 1.6; margin: 16px 0 0; text-align: center; }
  .msg { font-size: 0.86rem; margin-top: 14px; min-height: 1.2em; color: var(--danger); text-align: center; }
  .back-btn { display: block; margin: 18px auto 0; background: none; border: none; color: var(--text-secondary); font-family: inherit; font-size: 0.86rem; font-weight: 600; cursor: pointer; }
  .back-btn:hover { color: var(--text-primary); }
</style>
</head>
<body>

<header class="top-bar">
  <a href="index.html" class="brand">
    <img src="assets/images/logo-icon.png" width="24" height="24" alt="" style="border-radius:6px;" />
    PostureX
  </a>
  <div style="display:flex; align-items:center;">
    <a href="index.html" class="home-link" data-i18n="nav.backHome">← Trang chủ</a>
    <div class="lang-toggle">
      <button type="button" data-lang-toggle="vi" onclick="setLang('vi')">VI</button>
      <button type="button" data-lang-toggle="en" onclick="setLang('en')">EN</button>
    </div>
  </div>
</header>

<main class="wrap">
  <h1 data-i18n="checkout.title">Thanh toán</h1>

  <div class="card">
    <div class="row"><span class="k" data-i18n="checkout.plan">Gói</span><span class="v">Pro</span></div>
    <div class="row"><span class="k" data-i18n="checkout.duration">Thời hạn</span><span class="v" data-i18n="checkout.durationValue">30 ngày</span></div>
    <div class="row"><span class="k" data-i18n="checkout.method">Phương thức</span><span class="v" data-i18n="checkout.methodValue">Chuyển khoản QR (VietQR)</span></div>
    <div class="row"><span class="k" data-i18n="checkout.amount">Số tiền</span><span class="v big" id="v-amount">59.000đ</span></div>
  </div>

  <button type="button" class="btn" id="pay-btn" data-i18n="checkout.pay">Thanh toán bằng VietQR</button>
  <div class="msg" id="msg"></div>
  <p class="note" data-i18n="checkout.secureNote">Bạn sẽ được chuyển sang trang thanh toán của SePay để quét mã QR bằng app ngân hàng. Gói được nâng cấp tự động ngay khi thanh toán thành công.</p>
  <button type="button" class="back-btn" id="back-btn" data-i18n="checkout.backPlans">← Quay lại chọn gói</button>
</main>

<script src="assets/js/i18n.js"></script>
<script>
  // Giá chỉ để HIỂN THỊ — số tiền thật do server quyết định (services/upgrade_service.py).
  const PLANS = { pro: { amount: 59000 } };

  const planKey = new URLSearchParams(location.search).get("plan");
  const plan = PLANS[planKey];
  if (!plan) location.replace("index.html#pricing");

  const payBtn = document.getElementById("pay-btn");
  const msg = document.getElementById("msg");
  let paying = false;

  document.getElementById("v-amount").textContent = plan ? plan.amount.toLocaleString("vi-VN") + "đ" : "";

  function setPayLabel() {
    payBtn.textContent = paying ? t("checkout.redirecting") : t("checkout.pay");
  }
  document.addEventListener("posturex:langchange", setPayLabel);

  // Quay lại bằng nút Back của trình duyệt từ trang SePay: trang được khôi phục từ bộ nhớ
  // đệm ở trạng thái "đang chuyển trang" — mở khoá nút để người dùng thử lại.
  window.addEventListener("pageshow", () => {
    paying = false;
    payBtn.disabled = false;
    setPayLabel();
  });

  document.getElementById("back-btn").addEventListener("click", () => (location.href = "index.html#pricing"));

  // Server tạo đơn + chữ ký, trình duyệt POST form đó sang trang thanh toán của SePay.
  payBtn.addEventListener("click", async () => {
    if (paying) return;
    paying = true;
    payBtn.disabled = true;
    msg.textContent = "";
    setPayLabel();
    try {
      const res = await fetch("/api/upgrade", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ plan: planKey }),
      });
      if (res.status === 401) { location.href = "login.html"; return; }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : t("checkout.error"));

      const form = document.createElement("form");
      form.method = "POST";
      form.action = data.action;
      // Thứ tự trường giữ nguyên như server trả về — chữ ký phụ thuộc thứ tự này.
      for (const [name, value] of Object.entries(data.fields)) {
        const input = document.createElement("input");
        input.type = "hidden";
        input.name = name;
        input.value = value;
        form.appendChild(input);
      }
      document.body.appendChild(form);
      form.submit();
    } catch (err) {
      paying = false;
      payBtn.disabled = false;
      setPayLabel();
      msg.textContent = err.message || t("checkout.error");
    }
  });

  // Chưa đăng nhập thì sang trang đăng nhập (trang này chỉ dành cho người đã đăng nhập).
  (async () => {
    try {
      const res = await fetch("/api/auth/me", { credentials: "include" });
      if (!res.ok) location.replace("login.html");
    } catch {
      location.replace("login.html");
    }
  })();
</script>

</body>
</html>
