<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trang chủ — PostureX</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="favicon-256.png" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0B0C0D; --surface: #1A1B1D; --surface-elevated: #222325; --border: #2C2D30;
    --primary: #FF6F4F; --primary-muted: #402920; --on-primary: #FFFFFF;
    --text-primary: #F5F5F5; --text-secondary: #9A9A9E; --text-tertiary: #5C5D60;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text-primary);
    font-family: "Be Vietnam Pro", system-ui, sans-serif;
  }
  a { color: inherit; text-decoration: none; }
  header.top-bar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 24px;
    background: rgba(11, 12, 13, 0.82);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  header.top-bar .brand {
    display: flex; align-items: center; gap: 10px;
    font-family: "Inter", sans-serif; font-weight: 800; font-size: 1.05rem;
  }
  nav.top-links { display: flex; align-items: center; gap: 20px; }
  nav.top-links a { font-size: 0.86rem; color: var(--text-secondary); }
  nav.top-links a:hover { color: var(--text-primary); }
  nav.top-links button {
    background: none; border: 1px solid var(--border); color: var(--text-secondary);
    border-radius: 999px; padding: 7px 16px; font-family: inherit; font-size: 0.82rem; cursor: pointer;
  }
  nav.top-links button:hover { border-color: var(--primary); color: var(--text-primary); }
  .lang-toggle {
    display: flex; align-items: center; gap: 2px; background: var(--surface-elevated);
    border: 1px solid var(--border); border-radius: 999px; padding: 3px; margin-left: 14px;
  }
  .lang-toggle button {
    background: none; border: none; color: var(--text-secondary); font-family: inherit;
    font-size: 0.76rem; font-weight: 700; padding: 5px 10px; border-radius: 999px; cursor: pointer;
  }
  .lang-toggle button.active { background: var(--primary); color: var(--on-primary); }
  main.wrap { max-width: 920px; margin: 0 auto; padding: 36px 24px 80px; }
  h1 { font-family: "Inter", sans-serif; font-size: 1.5rem; margin: 0 0 4px; }
  .subtitle { color: var(--text-secondary); font-size: 0.92rem; margin: 0 0 28px; }
  .calendar-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 28px;
  }
  .weekday-label {
    text-align: center; color: var(--text-tertiary); font-size: 0.74rem;
    text-transform: uppercase; letter-spacing: 0.04em; padding-bottom: 4px;
  }
  .day-cell {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 8px; min-height: 68px; cursor: pointer; transition: border-color 0.12s ease;
    display: flex; flex-direction: column; gap: 4px;
  }
  .day-cell:hover { border-color: var(--text-secondary); }
  .day-cell.selected { border-color: var(--primary); background: var(--primary-muted); }
  .day-cell.rest { opacity: 0.55; }
  .day-cell.today { box-shadow: inset 0 0 0 1px var(--primary); }
  .day-cell .day-num { font-family: "Inter", sans-serif; font-weight: 700; font-size: 0.86rem; }
  .day-cell .session-name {
    font-size: 0.7rem; color: var(--text-secondary); line-height: 1.3;
    overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  #day-detail {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px;
  }
  #day-detail h2 { font-family: "Inter", sans-serif; font-size: 1.1rem; margin: 0 0 4px; }
  #day-detail .detail-date { color: var(--text-secondary); font-size: 0.86rem; margin-bottom: 16px; }
  .exercise-row {
    display: flex; justify-content: space-between; padding: 10px 0;
    border-bottom: 1px solid var(--border); font-size: 0.9rem;
  }
  .exercise-row:last-child { border-bottom: none; }
  .exercise-row .sets-reps { color: var(--text-secondary); }
  #loading, #error-box { text-align: center; color: var(--text-secondary); padding: 60px 20px; }
  .error-text { color: #FF6B6B; }

  .detail-header { display: flex; justify-content: space-between; align-items: flex-start; }
  .icon-btn {
    background: var(--surface-elevated); border: 1px solid var(--border); color: var(--text-secondary);
    width: 34px; height: 34px; border-radius: 10px; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-family: inherit;
  }
  .icon-btn:hover { border-color: var(--primary); color: var(--primary); }
  #day-detail input {
    width: 100%; background: var(--surface-elevated); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; color: var(--text-primary);
    font-size: 0.9rem; font-family: inherit;
  }
  #day-detail input:focus { outline: none; border-color: var(--primary); }
  #day-detail label { display: block; font-size: 0.78rem; color: var(--text-secondary); margin-bottom: 6px; }
  .exercise-edit-row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
  .exercise-edit-row input:first-child { flex: 3; }
  .exercise-edit-row input:nth-child(2) { flex: 2; }
  .remove-exercise-btn {
    background: none; border: none; color: var(--text-secondary); cursor: pointer;
    font-size: 1.1rem; width: 32px; height: 32px; flex-shrink: 0;
  }
  .remove-exercise-btn:hover { color: #FF6B6B; }
  .add-exercise-link {
    background: none; border: none; color: var(--primary); font-size: 0.86rem; font-weight: 600;
    cursor: pointer; font-family: inherit; padding: 0; margin-bottom: 16px;
  }
  .detail-edit-actions { display: flex; gap: 10px; }
  .detail-edit-actions button {
    flex: 1; border-radius: 999px; padding: 11px; font-family: inherit; font-size: 0.9rem;
    font-weight: 700; cursor: pointer; border: none;
  }
  .btn-save { background: var(--primary); color: var(--on-primary); }
  .btn-cancel { background: transparent; border: 1px solid var(--border) !important; color: var(--text-secondary); }
  .detail-error { color: #FF6B6B; font-size: 0.84rem; margin-bottom: 10px; }
</style>
</head>
<body>

<header class="top-bar">
  <a href="index.html" class="brand">
    <img src="assets/images/logo-icon.png" width="24" height="24" alt="" style="border-radius:6px;" />
    PostureX
  </a>
  <div style="display:flex; align-items:center;">
    <nav class="top-links">
      <button id="logout-btn" data-i18n="nav.logout">Đăng xuất</button>
    </nav>
    <div class="lang-toggle">
      <button type="button" data-lang-toggle="vi" onclick="setLang('vi')">VI</button>
      <button type="button" data-lang-toggle="en" onclick="setLang('en')">EN</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div id="loading" data-i18n="plan.loading">Đang tải lịch tập...</div>
  <div id="error-box" style="display:none;"></div>

  <div id="content" style="display:none;">
    <h1 id="greeting">Xin chào</h1>
    <p class="subtitle" data-i18n="plan.subtitle">Lịch tập 4 tuần của bạn — bấm vào một ngày để xem chi tiết.</p>

    <div class="calendar-grid" id="weekday-header"></div>
    <div class="calendar-grid" id="calendar-grid"></div>

    <div id="day-detail"></div>
  </div>
</main>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/onboarding-options.js"></script>
<script src="assets/js/workout-plan.js"></script>
<script>
  let plan = null;
  let currentEmail = null;
  let greetingName = "";

  function renderGreeting() {
    if (greetingName) document.getElementById("greeting").textContent = t("plan.greeting", { name: greetingName });
  }

  // Lịch/chi tiết ngày được sinh bằng JS (ngày theo locale, chữ trong template)
  // nên phải vẽ lại tay khi đổi ngôn ngữ. Đang mở form sửa dở thì quay về xem.
  document.addEventListener("posturex:langchange", () => {
    if (!plan) return;
    renderGreeting();
    renderCalendar();
    if (selectedIndex !== null) selectDay(selectedIndex);
  });

  function formatDateShort(date) {
    return date.toLocaleDateString(getLocale(), { day: "2-digit", month: "2-digit" });
  }

  function isSameDate(a, b) {
    return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  }

  function renderWeekdayHeader() {
    const container = document.getElementById("weekday-header");
    container.innerHTML = WEEKDAY_LABELS.map((l) => `<div class="weekday-label">${l}</div>`).join("");
  }

  function renderCalendar() {
    const container = document.getElementById("calendar-grid");
    const today = new Date();
    container.innerHTML = plan.days
      .map((day, i) => {
        const date = new Date(day.date);
        const classes = ["day-cell"];
        if (day.exercises.length === 0) classes.push("rest");
        if (isSameDate(date, today)) classes.push("today");
        return `
          <div class="${classes.join(" ")}" data-index="${i}">
            <span class="day-num">${formatDateShort(date)}</span>
            <span class="session-name">${escapeHtml(day.sessionName)}</span>
          </div>
        `;
      })
      .join("");

    [...container.children].forEach((cell) => {
      cell.addEventListener("click", () => selectDay(Number(cell.dataset.index)));
    });
  }

  let selectedIndex = null;

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function escapeAttr(s) {
    return escapeHtml(s).replace(/`/g, "&#96;");
  }

  function dateLabel(date) {
    return date.toLocaleDateString(getLocale(), { weekday: "long", day: "numeric", month: "numeric" });
  }

  function selectDay(index) {
    selectedIndex = index;
    const container = document.getElementById("calendar-grid");
    [...container.children].forEach((c, i) => c.classList.toggle("selected", i === index));
    renderDayDetail(index);
  }

  function renderDayDetail(index) {
    const day = plan.days[index];
    const date = new Date(day.date);
    const detail = document.getElementById("day-detail");

    if (day.exercises.length === 0) {
      detail.innerHTML = `
        <div class="detail-header">
          <div>
            <h2>${t("plan.restDay")}</h2>
            <div class="detail-date">${dateLabel(date)}</div>
          </div>
          <button class="icon-btn" id="edit-day-btn" title="${t("common.edit")}">✏️</button>
        </div>
        <p style="color:var(--text-secondary); margin:0;">${t("plan.restDayBody")}</p>
      `;
    } else {
      detail.innerHTML = `
        <div class="detail-header">
          <div>
            <h2>${escapeHtml(day.sessionName)}</h2>
            <div class="detail-date">${dateLabel(date)}</div>
          </div>
          <button class="icon-btn" id="edit-day-btn" title="${t("common.edit")}">✏️</button>
        </div>
        ${day.exercises
          .map((ex) => `<div class="exercise-row"><span>${escapeHtml(ex.name)}</span><span class="sets-reps">${escapeHtml(ex.setsReps)}</span></div>`)
          .join("")}
      `;
    }
    document.getElementById("edit-day-btn").addEventListener("click", () => renderDayEditor(index));
  }

  // Giống hệt cơ chế sửa ngày trên app (lib/widgets/plan_calendar.dart,
  // _DayDetailSheet): đổi tên buổi tập + thêm/bớt/sửa từng bài tập tại chỗ.
  function renderDayEditor(index) {
    const day = plan.days[index];
    const date = new Date(day.date);
    const detail = document.getElementById("day-detail");
    const drafts = day.exercises.map((ex) => ({ name: ex.name, setsReps: ex.setsReps }));

    function renderExerciseRows() {
      return drafts
        .map(
          (ex, i) => `
        <div class="exercise-edit-row">
          <input type="text" placeholder="${t("plan.exerciseNamePlaceholder")}" value="${escapeAttr(ex.name)}" data-ex-name="${i}" />
          <input type="text" placeholder="${t("plan.setsRepsPlaceholder")}" value="${escapeAttr(ex.setsReps)}" data-ex-setsreps="${i}" />
          <button class="remove-exercise-btn" data-remove="${i}" title="${t("common.remove")}">✕</button>
        </div>
      `
        )
        .join("");
    }

    function rerenderRows() {
      document.getElementById("exercise-edit-rows").innerHTML = renderExerciseRows();
      wireRowEvents();
    }

    function wireRowEvents() {
      document.querySelectorAll("[data-ex-name]").forEach((input) => {
        input.addEventListener("input", (e) => (drafts[Number(e.target.dataset.exName)].name = e.target.value));
      });
      document.querySelectorAll("[data-ex-setsreps]").forEach((input) => {
        input.addEventListener("input", (e) => (drafts[Number(e.target.dataset.exSetsreps)].setsReps = e.target.value));
      });
      document.querySelectorAll("[data-remove]").forEach((btn) => {
        btn.addEventListener("click", () => {
          drafts.splice(Number(btn.dataset.remove), 1);
          rerenderRows();
        });
      });
    }

    detail.innerHTML = `
      <div class="detail-date" style="margin-bottom:12px;">${dateLabel(date)}</div>
      <label for="edit-session-name">${t("plan.sessionNameLabel")}</label>
      <input type="text" id="edit-session-name" value="${escapeAttr(day.exercises.length === 0 ? "" : day.sessionName)}" placeholder="${t("plan.sessionNamePlaceholder")}" style="margin-bottom:16px;" />
      <div id="exercise-edit-rows">${renderExerciseRows()}</div>
      <button class="add-exercise-link" id="add-exercise-btn">${t("plan.addExercise")}</button>
      <div class="detail-error" id="day-edit-error" style="display:none;"></div>
      <div class="detail-edit-actions">
        <button class="btn-cancel" id="cancel-day-edit">${t("account.cancel")}</button>
        <button class="btn-save" id="save-day-edit">${t("account.save")}</button>
      </div>
    `;

    wireRowEvents();
    document.getElementById("add-exercise-btn").addEventListener("click", () => {
      drafts.push({ name: "", setsReps: "3 × 10" });
      rerenderRows();
    });
    document.getElementById("cancel-day-edit").addEventListener("click", () => renderDayDetail(index));
    document.getElementById("save-day-edit").addEventListener("click", () => {
      const sessionNameInput = document.getElementById("edit-session-name").value.trim();
      const errorBox = document.getElementById("day-edit-error");
      const cleanExercises = drafts
        .filter((d) => d.name.trim() !== "")
        .map((d) => ({ name: d.name.trim(), setsReps: d.setsReps.trim() || "3 × 10" }));

      if (cleanExercises.length > 0 && !sessionNameInput) {
        errorBox.textContent = t("plan.sessionNameRequired");
        errorBox.style.display = "block";
        return;
      }

      plan.days[index] = {
        date: day.date,
        sessionName: cleanExercises.length === 0 ? "Rest" : sessionNameInput,
        exercises: cleanExercises,
      };
      persistPlan();
      renderCalendar();
      selectDay(index);
    });
  }

  // Lưu lại toàn bộ plan hiện tại vào localStorage — kể cả khi phiên này
  // chưa từng có cache (đăng nhập bình thường, không qua đăng ký trên máy
  // này), vì sau khi sửa tay 1 ngày thì CẦN một nơi để giữ lại thay đổi đó,
  // giống TokenStorage.saveAiPlanDays() của app.
  function persistPlan() {
    const existingRaw = localStorage.getItem("posturex_plan");
    const existing = existingRaw ? JSON.parse(existingRaw) : null;
    const criteria =
      existing && existing.email === currentEmail && existing.criteria
        ? existing.criteria
        : { workoutDays: [], focusAreas: [], equipment: [], goals: [], healthIssues: [] };

    localStorage.setItem(
      "posturex_plan",
      JSON.stringify({
        email: currentEmail,
        startDate: plan.startDate.toISOString(),
        days: plan.days.map((d) => ({ ...d, date: d.date.toISOString() })),
        criteria,
      })
    );
  }

  function reviveDates(stored) {
    return {
      startDate: new Date(stored.startDate),
      days: stored.days.map((d) => ({ ...d, date: new Date(d.date) })),
    };
  }

  (async () => {
    const loading = document.getElementById("loading");
    const errorBox = document.getElementById("error-box");
    const content = document.getElementById("content");

    try {
      const meRes = await fetch("/api/auth/me", { credentials: "include" });
      if (!meRes.ok) {
        window.location.href = "login.html";
        return;
      }
      const me = await meRes.json();
      currentEmail = me.email;
      greetingName = me.full_name || me.email;
      renderGreeting();

      // localStorage lưu trên CẢ THIẾT BỊ (không phải riêng 1 tab) — khớp
      // TokenStorage.savePlanParams()/readPlanParams() của app, đọc lại đầy
      // đủ ngày tập/nhóm cơ/thiết bị/mục tiêu lúc đăng nhập. Kiểm tra đúng
      // email để tránh lộ lịch tập của tài khoản khác từng đăng ký trên
      // cùng trình duyệt này.
      const storedRaw = localStorage.getItem("posturex_plan");
      const stored = storedRaw ? JSON.parse(storedRaw) : null;
      if (stored && stored.email === me.email) {
        plan = reviveDates(stored);
      } else {
        // Chưa từng đăng ký trên máy này, hoặc là tài khoản khác — chỉ còn
        // 5 trường có lưu ở backend, các trường còn lại (ngày tập/nhóm cơ/
        // thiết bị/mục tiêu/vấn đề sức khoẻ) dùng mặc định, đúng hành vi
        // applyAuthSession() của app khi chưa có TokenStorage.readPlanParams().
        const [profileRes, exercisesRes] = await Promise.all([
          fetch("/api/profile", { credentials: "include" }),
          fetch("/api/exercises", { credentials: "include" }),
        ]);
        const profile = profileRes.ok ? await profileRes.json() : {};
        const serverExercises = exercisesRes.ok
          ? (await exercisesRes.json()).map((e) => ({
              name: e.name,
              muscleGroups: e.muscle_groups || [],
              difficulty: e.difficulty,
              supportsAnalysis: e.supports_analysis,
            }))
          : [];

        plan = generateWorkoutPlan({
          workoutDays: new Set(),
          weeklyGoal: profile.weekly_goal || 4,
          focusAreas: new Set(),
          fitnessLevel: profile.fitness_level || "Regular",
          serverExercises,
        });
      }

      renderWeekdayHeader();
      renderCalendar();
      loading.style.display = "none";
      content.style.display = "block";
    } catch (err) {
      loading.style.display = "none";
      errorBox.innerHTML = `<p class="error-text">${t("plan.loadError")}</p>`;
      errorBox.style.display = "block";
    }
  })();

  document.getElementById("logout-btn").addEventListener("click", async () => {
    // Cố tình KHÔNG xoá "posturex_plan" — khớp TokenStorage.clearSession()
    // của app, giữ lại lịch tập để đăng nhập lại trên máy này thấy ngay.
    await fetch("/api/auth/logout", { method: "POST", credentials: "include" });
    window.location.href = "login.html";
  });
</script>

</body>
</html>
